<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ショートステイ連絡帳</title>
<!-- PDF作成に使うライブラリ本体を直接読み込む
     （html2pdf.jsの自動改ページ機能は不具合が多いため使わず、
     html2canvasとjsPDFを自分で組み合わせてPDFを作っている） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- 記録・利用者/担当職員リストを全端末で共有するためのFirestore（Firebase） -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --main:#ff9466;
    --main-dark:#e77a4a;
    --sub:#6ea8b8;
    --bg:#fbf7f2;
    --card:#ffffff;
    --text:#3a3532;
    --text-light:#8a8078;
    --border:#ecdfd3;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:40px;
    overflow-x:hidden;
  }
  header{
    background:linear-gradient(135deg,var(--main),var(--main-dark));
    color:#fff;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  header .top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  header h1{
    margin:0;
    font-size:18px;
    font-weight:700;
  }
  header .sub{
    font-size:12px;
    opacity:.9;
    margin-top:2px;
  }
  .switch{
    display:flex;
    background:rgba(255,255,255,.25);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .switch button{
    border:none;
    background:transparent;
    color:#fff;
    padding:7px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    opacity:.75;
  }
  .switch button.active{
    background:#fff;
    color:var(--main-dark);
    opacity:1;
  }
  main{
    max-width:560px;
    margin:0 auto;
    padding:16px;
  }
  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 1px 4px rgba(0,0,0,.05);
    border:1px solid var(--border);
  }
  .card h2{
    font-size:15px;
    margin:0 0 12px;
    color:var(--main-dark);
    display:flex;
    align-items:center;
    gap:6px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin:10px 0 6px;
    color:var(--text);
  }
  select, input[type=text], input[type=date], input[type=time], input[type=number], textarea{
    width:100%;
    max-width:100%;
    min-width:0;
    box-sizing:border-box;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:14px;
    font-family:inherit;
    background:#fffaf5;
    color:var(--text);
  }
  /* iOSのSafariはdate/timeのネイティブ入力欄が幅100%を無視して
     はみ出すことがあるため、追加で明示的に幅を抑える */
  input[type=date], input[type=time]{
    -webkit-appearance:none;
    appearance:none;
    display:block;
  }
  textarea{
    resize:vertical;
    min-height:60px;
  }
  .btn-group{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .btn-group button{
    flex:1;
    min-width:70px;
    padding:10px 6px;
    border:1px solid var(--border);
    background:#fffaf5;
    border-radius:10px;
    font-size:13px;
    cursor:pointer;
    color:var(--text);
    transition:.15s;
  }
  .btn-group button.selected{
    background:var(--main);
    color:#fff;
    border-color:var(--main);
    font-weight:700;
  }
  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .chk-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    font-weight:600;
    color:var(--text);
    cursor:pointer;
  }
  .chk-row input[type=checkbox]{
    width:18px;
    height:18px;
    accent-color:var(--main);
    cursor:pointer;
    flex-shrink:0;
  }
  .field-block{
    padding:12px;
    background:#fdf6ee;
    border-radius:12px;
    margin-bottom:10px;
  }
  .field-block .ttl{
    font-size:13px;
    font-weight:700;
    margin-bottom:8px;
    color:var(--main-dark);
  }
  .unit-input{
    position:relative;
  }
  .unit-input input{
    padding-right:40px;
  }
  .unit-input .unit-suffix{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text-light);
    font-size:14px;
    font-weight:600;
    pointer-events:none;
  }
  .ai-proof-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:8px;
  }
  .ai-proof-btn{
    border:1.5px solid var(--sub);
    background:#fff;
    color:var(--sub);
    font-weight:700;
    font-size:12px;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .ai-proof-btn:disabled{
    opacity:.6;
  }
  .ai-undo-btn{
    border:none;
    background:none;
    color:var(--text-light);
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .fixed-note-preview{
    margin-top:12px;
    background:#fdf6ee;
    border:1px dashed var(--border);
    border-radius:10px;
    padding:10px 12px;
  }
  .fixed-note-preview-label{
    font-size:11px;
    font-weight:700;
    color:var(--main-dark);
    margin-bottom:6px;
  }
  .fixed-note-preview #fixedNoteText{
    font-size:12px;
    line-height:1.7;
    color:var(--text-light);
  }
  .user-row{
    display:flex;
    gap:6px;
    margin-bottom:6px;
  }
  .user-row input{
    flex:1;
    padding:8px 10px;
    font-size:13px;
  }
  .user-row button{
    border:none;
    background:#fbe6e0;
    color:#b74a2c;
    width:34px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
  }
  .save-bar{
    position:sticky;
    bottom:0;
    background:linear-gradient(0deg,var(--bg) 60%,transparent);
    padding:14px 0 6px;
    display:flex;
    gap:8px;
  }
  .save-btn{
    flex:1;
    padding:15px;
    background:var(--main);
    color:#fff;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(255,148,102,.4);
  }
  .save-btn.pdf{
    background:var(--sub);
    box-shadow:0 4px 10px rgba(110,168,184,.4);
  }
  .save-btn:active{ transform:scale(.98); }
  .save-btn:disabled{ opacity:.6; }
  .clear-btn{
    flex:0 0 64px;
    padding:15px 6px;
    background:#fff;
    border:1.5px solid var(--text-light);
    color:var(--text-light);
    border-radius:12px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .clear-btn:active{ transform:scale(.98); }
  .toast{
    position:fixed;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    background:#7cb37c;
    color:#fff;
    padding:10px 20px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s, top .3s;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    top:100px;
  }

  /* 記録一覧画面 */
  .user-select-bar{
    margin-bottom:14px;
  }
  .entry-card{
    background:var(--card);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    border:1px solid var(--border);
    box-shadow:0 1px 4px rgba(0,0,0,.05);
  }
  .entry-card .date{
    font-size:13px;
    color:var(--text-light);
    font-weight:600;
  }
  .entry-card .headline{
    font-size:15px;
    font-weight:700;
    margin:4px 0 10px;
  }
  .tag-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:10px;
  }
  .tag{
    font-size:12px;
    padding:5px 10px;
    border-radius:999px;
    background:#fdf1e7;
    color:var(--main-dark);
    font-weight:600;
  }
  .note-box{
    background:#f7f2ec;
    border-radius:10px;
    padding:10px 12px;
    font-size:13px;
    line-height:1.6;
    margin-top:8px;
    white-space:pre-wrap;
  }
  .entry-btn-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
  }
  .del-btn{
    flex:1;
    min-width:80px;
    padding:11px;
    border-radius:10px;
    border:1.5px solid var(--sub);
    background:#fff;
    color:var(--sub);
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .pdf-btn{
    flex:1;
    min-width:80px;
    padding:11px;
    border-radius:10px;
    border:1.5px solid var(--main-dark);
    background:#fff;
    color:var(--main-dark);
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .edit-btn{
    flex:1;
    min-width:80px;
    padding:11px;
    border-radius:10px;
    border:none;
    background:var(--main);
    color:#fff;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .empty-msg{
    text-align:center;
    color:var(--text-light);
    padding:40px 10px;
    font-size:13px;
  }
  .edit-banner{
    background:#fff4e9;
    border:1.5px solid var(--main);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .edit-banner-text{
    font-size:13px;
    font-weight:700;
    color:var(--main-dark);
  }
  .edit-banner button{
    flex-shrink:0;
    border:none;
    background:none;
    color:var(--text-light);
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .hidden{ display:none !important; }

  /* ===== PDF生成用オーバーレイ ===== */
  /* html2canvasはposition:fixedの要素(や、その内側の要素)を正しく
     キャプチャできないことがあるため、position:fixedは使わず、
     ページ先頭にスクロールした上でposition:absoluteで全面表示する */
  #pdfOverlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    min-height:100vh;
    background:rgba(58,53,50,.55);
    z-index:999;
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:32px 12px;
  }
  #pdfOverlay.show{ display:flex; }
  #pdfOverlay .pdf-generating-label{
    position:absolute;
    top:16px;
    left:50%;
    transform:translateX(-50%);
    background:#fff;
    color:var(--main-dark);
    font-size:13px;
    font-weight:700;
    padding:8px 16px;
    border-radius:999px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
  }
  #pdfTemplate{
    /* max-width:100%は付けない：スマホ幅に合わせて縮むとPDF化した時に
       おかしなサイズ・改ページになるため、常に700pxで確定させる */
    width:700px;
    flex-shrink:0;
    background:#fff;
    color:#3a3532;
    border-radius:16px;
    overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  #pdfTemplate .pdf-header{
    background:linear-gradient(135deg,var(--main),var(--main-dark));
    color:#fff;
    padding:44px 40px 40px;
  }
  #pdfTemplate .pdf-eyebrow{
    font-size:13px;
    letter-spacing:5px;
    opacity:.85;
    margin-bottom:8px;
  }
  #pdfTemplate .pdf-title{
    font-size:30px;
    font-weight:700;
  }
  #pdfTemplate .pdf-date-badge{
    display:inline-block;
    margin-top:18px;
    background:rgba(255,255,255,.25);
    padding:8px 18px;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
  }
  #pdfTemplate .pdf-body{
    padding:40px 40px 8px;
  }
  #pdfTemplate .pdf-profile{
    display:flex;
    gap:16px;
    margin-bottom:30px;
  }
  #pdfTemplate .pdf-stat{
    flex:1;
    background:#fdf6ee;
    border-radius:12px;
    padding:22px 18px;
  }
  #pdfTemplate .pdf-stat .k{
    font-size:12px;
    color:#a8886f;
    font-weight:700;
    margin-bottom:8px;
  }
  #pdfTemplate .pdf-stat .v{
    font-size:23px;
    font-weight:700;
    color:#3a3532;
  }
  #pdfTemplate .pdf-section{
    margin-top:36px;
    padding-bottom:34px;
    border-bottom:1px solid #f0e6da;
  }
  #pdfTemplate .pdf-section:last-child{
    border-bottom:none;
    padding-bottom:0;
  }
  #pdfTemplate .pdf-section-title{
    font-size:16px;
    font-weight:700;
    color:var(--main-dark);
    margin-bottom:16px;
  }
  #pdfTemplate .pdf-label{
    font-size:12px;
    color:#a8886f;
    font-weight:700;
    margin-bottom:8px;
  }
  #pdfTemplate .pdf-badges{
    display:flex;
    gap:10px;
    margin-bottom:18px;
  }
  #pdfTemplate .pdf-badge{
    padding:8px 18px;
    border-radius:999px;
    font-size:14px;
    font-weight:700;
    background:#f4efe9;
    color:#b3a291;
  }
  #pdfTemplate .pdf-badge.active{
    background:var(--main);
    color:#fff;
  }
  #pdfTemplate .pdf-text{
    font-size:15px;
    line-height:2;
    color:#4a433d;
    white-space:pre-wrap;
    margin-bottom:18px;
  }
  #pdfTemplate .pdf-text:last-child{ margin-bottom:0; }
  #pdfTemplate .pdf-note{
    background:#fff8f0;
    border-left:4px solid var(--main);
    border-radius:0 10px 10px 0;
    padding:16px 18px;
    font-size:14px;
    line-height:1.9;
    color:#4a433d;
    white-space:pre-wrap;
  }
  #pdfTemplate .pdf-footer{
    background:#faf3ec;
    padding:16px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  #pdfTemplate .pdf-footer-staff{
    font-size:16px;
    font-weight:700;
    color:var(--main-dark);
  }
  #pdfTemplate .pdf-footer-sub{
    font-size:11px;
    color:#a8886f;
  }
</style>
</head>
<body>

<header>
  <div class="top-row">
    <div>
      <h1 id="headerTitle">ショートステイ クロム</h1>
      <div class="sub">連絡帳作成ツール（プロトタイプ）</div>
    </div>
    <div class="switch">
      <button id="tabStaff" class="active">入力</button>
      <button id="tabParent">記録一覧</button>
    </div>
  </div>
</header>

<main>

  <!-- ===== 入力画面 ===== -->
  <div id="staffView">

    <div id="editBanner" class="card hidden edit-banner">
      <div class="edit-banner-text">✏️ <span id="editBannerText"></span>を編集中</div>
      <button type="button" id="cancelEditBtn">編集をやめる</button>
    </div>

    <div class="card">
      <h2>📋 基本情報</h2>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label style="margin:10px 0 6px;">お名前</label>
        <button type="button" id="toggleUserManage" style="border:none; background:none; color:var(--main-dark); font-size:12px; font-weight:700; cursor:pointer; padding:0;">利用者を編集</button>
      </div>
      <select id="s_user"></select>

      <div id="userManagePanel" class="hidden field-block" style="margin-top:10px;">
        <div class="ttl">利用者リストの編集</div>
        <div id="userManageList"></div>
        <div class="user-row">
          <input type="text" id="newUserInput" placeholder="新しい利用者名を入力">
          <button type="button" id="addUserRowBtn" style="width:auto; padding:0 14px; background:var(--main); color:#fff; font-weight:700;">追加</button>
        </div>
      </div>

      <label>利用日</label>
      <input type="date" id="s_date">
      <label>体温（来所時）</label>
      <div class="unit-input">
        <input type="number" id="s_temp" step="0.1">
        <span class="unit-suffix">℃</span>
      </div>
    </div>

    <div class="card">
      <h2>🍽️ 夕食</h2>
      <label>献立</label>
      <textarea id="s_menu" placeholder="例：カレーライス、サラダ、スープ"></textarea>
      <div class="field-block">
        <div class="ttl">摂取量</div>
        <div class="btn-group" data-group="meal">
          <button data-val="完食">完食</button>
          <button data-val="半分">半分</button>
          <button data-val="少量">少量</button>
        </div>
      </div>
      <label>食事中の様子</label>
      <textarea id="s_mealNote" placeholder="例：美味しそうに召し上がっていました"></textarea>
      <div class="ai-proof-row">
        <button type="button" class="ai-proof-btn" data-target="s_mealNote">✨ AIで添削する</button>
        <button type="button" class="ai-undo-btn hidden" data-target="s_mealNote">元に戻す</button>
      </div>
    </div>

    <div class="card">
      <h2>🛁 入浴</h2>
      <label>時間</label>
      <input type="time" id="s_bathTime">
    </div>

    <div class="card">
      <h2>💊 服薬</h2>
      <div class="field-block">
        <div class="ttl">服薬</div>
        <div class="btn-group" data-group="medication">
          <button data-val="あり">あり</button>
          <button data-val="なし">なし</button>
        </div>
      </div>
      <div class="field-block">
        <div class="ttl">タイミング（複数選択可）</div>
        <div class="btn-group" data-group="medTiming" data-multi="true">
          <button data-val="夕食後">夕食後</button>
          <button data-val="入浴後">入浴後</button>
          <button data-val="寝る前">寝る前</button>
          <button data-val="起床時">起床時</button>
          <button data-val="朝食後">朝食後</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>💬 スタッフからひとこと</h2>
      <label style="margin-top:0;">個別に伝えたいこと（任意）</label>
      <textarea id="s_note" placeholder="例：今日は少し咳がありました等、その日だけ伝えたいことがあれば入力"></textarea>
      <div class="ai-proof-row">
        <button type="button" class="ai-proof-btn" data-target="s_note">✨ AIで添削する</button>
        <button type="button" class="ai-undo-btn hidden" data-target="s_note">元に戻す</button>
      </div>
      <div class="fixed-note-preview">
        <div class="fixed-note-preview-label">📌 下記の定型文はPDF作成時に自動で追加されます（編集不要）</div>
        <div id="fixedNoteText"></div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label style="margin:0 0 6px;">担当職員</label>
        <button type="button" id="toggleStaffManage" style="border:none; background:none; color:var(--main-dark); font-size:12px; font-weight:700; cursor:pointer; padding:0;">担当職員を編集</button>
      </div>
      <select id="s_staff"></select>

      <div id="staffManagePanel" class="hidden field-block" style="margin-top:10px;">
        <div class="ttl">担当職員リストの編集</div>
        <div id="staffManageList"></div>
        <div class="user-row">
          <input type="text" id="newStaffInput" placeholder="新しい担当職員名を入力">
          <button type="button" id="addStaffRowBtn" style="width:auto; padding:0 14px; background:var(--main); color:#fff; font-weight:700;">追加</button>
        </div>
      </div>
    </div>

    <div class="save-bar">
      <button type="button" class="clear-btn" id="clearFormBtn">クリア</button>
      <button class="save-btn" id="saveBtn">保存する</button>
      <button class="save-btn pdf" id="savePdfBtn">保存してPDF作成</button>
    </div>
  </div>

  <!-- ===== 記録一覧（スタッフ用） ===== -->
  <div id="parentView" class="hidden">
    <div class="card user-select-bar">
      <label style="margin-top:0">お名前で絞り込み</label>
      <select id="p_user"></select>
    </div>
    <div id="entryList"></div>
  </div>

</main>

// 施設共有のAPIキーを埋め込み済み。個別に設定する必要はない。
const GEMINI_API_KEY = "AQ.Ab8RN6Joo7e9kdGbN3SVLtmtoF-BcDJXTU7VEikW6luBeVqFdg";

async function proofreadWithGemini(text){
  const key = GEMINI_API_KEY;

  const prompt =
    "あなたは日本語の文章を添削するアシスタントです。以下は介護・福祉施設のスタッフが保護者向けに書いた連絡帳の一文です。" +
    "誤字脱字や不自然な言い回し、助詞の誤りがあれば自然な日本語に直してください。" +
    "内容や意味、敬語の丁寧さのレベルは変えないでください。説明や前置きは一切不要です。添削後の文章だけを出力してください。\n\n" +
    "文章：" + text;

  // "AQ."形式の新しいキーは ?key= のクエリパラメータでは弾かれることがあるため、
  // 現在推奨されている x-goog-api-key ヘッダーで送る
  // モデル名は固定バージョンだと廃止されるたびに直す必要が出るため、
  // 常に最新のFlashモデルを指す "gemini-flash-latest" を使う
  const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent";
  const res = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-goog-api-key": key
    },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }]
    })
  });

  if(!res.ok){
    const errBody = await res.text().catch(()=> "");
    console.error("Gemini API error", res.status, errBody);
    throw new Error("API_ERROR_" + res.status + ": " + errBody.slice(0, 200));
  }

  const data = await res.json();
  const result = data && data.candidates && data.candidates[0] &&
    data.candidates[0].content && data.candidates[0].content.parts &&
    data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;

  if(!result) throw new Error("NO_RESULT");
  return result.trim();
}

const originalTextBeforeProof = {}; // { textareaId: 元のテキスト }

document.querySelectorAll(".ai-proof-btn").forEach(btn=>{
  btn.addEventListener("click", async ()=>{
    const targetId = btn.dataset.target;
    const textarea = document.getElementById(targetId);
    const text = textarea.value.trim();

    if(!text){
      showToast("添削する文章がありません");
      return;
    }

    const originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = "添削中…";

    try{
      const corrected = await proofreadWithGemini(text);
      originalTextBeforeProof[targetId] = text;
      textarea.value = corrected;
      const undoBtn = document.querySelector(`.ai-undo-btn[data-target="${targetId}"]`);
      if(undoBtn) undoBtn.classList.remove("hidden");

      console.error("添削に失敗しました", err);
      showToast("添削に失敗：" + (err && err.message ? err.message : "不明なエラー"), 6000);
    }finally{
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  });
});

      <div class="entry-btn-row">
        <button class="edit-btn" data-edit="${e.id}">編集</button>
        <button class="pdf-btn" data-pdf="${e.id}">PDFをダウンロード</button>
        <button class="del-btn" data-del="${e.id}">削除</button>
      </div>
    `;
    container.appendChild(card);
  });

  container.querySelectorAll(".edit-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.edit;
      const entry = entries.find(e=>e.id===id);
      if(entry) startEditEntry(entry);
    });
  });

  container.querySelectorAll(".del-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.del;
      if(btn.dataset.confirming === "1"){
        db.collection("entries").doc(id).delete().catch(err=>{
          console.error("削除に失敗しました", err);
          showToast("削除に失敗しました。通信環境を確認してください。", 4000);
        });
        return;
      }
      btn.dataset.confirming = "1";
      const original = btn.textContent;
      btn.textContent = "本当に削除する？";
      setTimeout(()=>{
        if(btn.isConnected && btn.dataset.confirming === "1"){
          btn.dataset.confirming = "0";
          btn.textContent = original;
        }
      }, 3000);
    });
  });

  container.querySelectorAll(".pdf-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.pdf;
      const entry = entries.find(e=>e.id===id);
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = "作成中…";
      exportPdf(entry).finally(()=>{
        btn.disabled = false;
        btn.textContent = original;
      });
    });
  });
}

function formatDate(dstr){
  const d = new Date(dstr+"T00:00:00");
  const days = ["日","月","火","水","木","金","土"];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;
}

function escapeHtml(str){
  return (str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
}

/* ---- PDF出力：テンプレートの見た目を清書して生成 ----
   1ページ目（服薬まで）と2ページ目（スタッフからひとこと）は別々のHTMLとして
   組み立て、それぞれ個別にhtml2canvasでキャプチャしてjsPDFに1ページずつ
   貼り付ける（html2pdf.jsの自動改ページ/pagebreak機能は、余白の挟まり方や
   横幅のスケーリングでたびたび不具合が出たため使わない） */
function buildPdfPage1Html(e){
  const d = new Date(e.date+"T00:00:00");
  const days = ["日","月","火","水","木","金","土"];
  const dateLabel = `${reiwa(e.date)}年${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;
  const mealBadges = MEAL_OPTIONS.map(o=>
    `<span class="pdf-badge${o===e.meal ? " active" : ""}">${o}</span>`
  ).join("");
  const medBadges = ["あり","なし"].map(o=>
    `<span class="pdf-badge${o===e.medication ? " active" : ""}">${o}</span>`
  ).join("");

  return `
    <div class="pdf-header">
      <div class="pdf-eyebrow">SHORT STAY</div>
      <div class="pdf-title">${escapeHtml(e.facility||"")}　連絡帳</div>
      <div class="pdf-date-badge">📅 ${dateLabel}</div>
    </div>
    <div class="pdf-body" style="padding-bottom:40px;">
      <div class="pdf-profile">
        <div class="pdf-stat">
          <div class="k">🧒 お名前</div>
          <div class="v">${escapeHtml(e.user)}</div>
        </div>
        <div class="pdf-stat">
          <div class="k">🌡️ 体温（来所時）</div>
          <div class="v">${escapeHtml(e.temp)}℃</div>
        </div>
      </div>

      <div class="pdf-section">
        <div class="pdf-section-title">🍽️ 夕食</div>
        <div class="pdf-label">献立</div>
        <div class="pdf-text">${escapeHtml(e.menu)||"（記入なし）"}</div>
        <div class="pdf-label">摂取量</div>
        <div class="pdf-badges">${mealBadges}</div>
        <div class="pdf-label">食事中の様子</div>
        <div class="pdf-text">${escapeHtml(e.mealNote)||"（記入なし）"}</div>
      </div>

      <div class="pdf-section">
        <div class="pdf-section-title">🛁 入浴</div>
        <div class="pdf-text">🕐 ${escapeHtml(e.bathTime)||"未記入"}</div>
      </div>

      <div class="pdf-section" style="border-bottom:none; padding-bottom:0;">
        <div class="pdf-section-title">💊 服薬</div>
        <div class="pdf-label">服薬</div>
        <div class="pdf-badges">${medBadges}</div>
        ${e.medication==="あり" ? `
        <div class="pdf-label">タイミング</div>
        <div class="pdf-text">${e.medTiming && e.medTiming.length ? escapeHtml(e.medTiming.join("、")) : "（未選択）"}</div>
        ` : ""}
      </div>
    </div>
  `;
}

function buildPdfPage2Html(e){
  return `
    <div class="pdf-body" style="padding-top:40px; padding-bottom:8px;">
      <div class="pdf-section" style="margin-top:0; border-bottom:none; padding-bottom:0;">
        <div class="pdf-section-title">💬 スタッフからひとこと</div>
        <div class="pdf-note">${e.note ? escapeHtml(e.note) + "<br><br>" : ""}${escapeHtml(FIXED_NOTE)}</div>
      </div>
    </div>
    <div class="pdf-footer">
      <span class="pdf-footer-staff">👤 担当者：${escapeHtml(e.staff)||"未入力"}</span>
      <span class="pdf-footer-sub">ショートステイ　${escapeHtml(e.facility||"")}　連絡帳</span>
    </div>
  `;
}

// html2pdf.jsの自動改ページ(pagebreakオプション)は、marginとの組み合わせで
// 空白ページが挟まったり、ページ幅いっぱいに画像が広がらず右側に空白が
// できたりと、何度も不具合が出た。そのため2ページ分は自前でキャプチャし、
// jsPDFに1ページずつ「必ずページ幅いっぱい」に貼り付ける方式に変更する。
async function exportPdf(entry){
  const overlay = document.getElementById("pdfOverlay");
  const el = document.getElementById("pdfTemplate");

  overlay.classList.add("show");
  overlay.scrollTop = 0;

  // 入力フォームをスクロールした状態で保存ボタンを押すと、
  // html2canvasが座標をそのスクロール量だけズレて計算してしまう不具合が
  // あったため、ページを一番上に戻してからキャプチャする
  window.scrollTo(0, 0);

  // オーバーレイが実際に描画されるのを待ってからキャプチャする
  await new Promise(r => requestAnimationFrame(()=>requestAnimationFrame(r)));

  try{
    const canvasOpt = {
      scale: 2,
      useCORS: true,
      backgroundColor: "#ffffff",
      scrollX: 0,
      scrollY: 0
    };

    el.innerHTML = buildPdfPage1Html(entry);
    const canvas1 = await html2canvas(el, canvasOpt);

    el.innerHTML = buildPdfPage2Html(entry);
    const canvas2 = await html2canvas(el, canvasOpt);

    // A4サイズ（pt）を基準の幅・最低の高さとして使う。文章がたくさん入力されて
    // 1ページ分より内容が長くなった場合は、文字を縮めたり切ったりせず、
    // そのページ自体をその分だけ縦に伸ばして全部入りきるようにする
    const pageW = 595.28;
    const minPageH = 841.89;
    const imgH1 = canvas1.height * pageW / canvas1.width;
    const imgH2 = canvas2.height * pageW / canvas2.width;
    const pageH1 = Math.max(imgH1, minPageH);
    const pageH2 = Math.max(imgH2, minPageH);

    // jspdf.umd.min.jsを読み込むと window.jspdf.jsPDF としてコンストラクタが使える
    const JsPDFCtor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
    const pdf = new JsPDFCtor({ unit: "pt", format: [pageW, pageH1], orientation: "portrait" });
    pdf.addImage(canvas1.toDataURL("image/jpeg", 0.98), "JPEG", 0, 0, pageW, imgH1);

    pdf.addPage([pageW, pageH2]);
    pdf.addImage(canvas2.toDataURL("image/jpeg", 0.98), "JPEG", 0, 0, pageW, imgH2);

    pdf.save(`連絡帳_${entry.user}_${entry.date}.pdf`);
  }catch(err){
    console.error("PDF生成に失敗しました", err);
    showToast("PDFの作成に失敗しました。もう一度お試しください。");
  }finally{
    overlay.classList.remove("show");
  }
}
