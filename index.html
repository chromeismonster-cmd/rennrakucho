<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- 記録・利用者/担当職員リストを全端末で共有するためのFirestore（Firebase） -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --main:#ff9466;
    --main-dark:#e77a4a;
    --sub:#6ea8b8;
    --bg:#fbf7f2;
    --card:#ffffff;
    --text:#3a3532;
    --text-light:#8a8078;
    --border:#ecdfd3;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:40px;
    overflow-x:hidden;
  }
  header{
    background:linear-gradient(135deg,var(--main),var(--main-dark));
    color:#fff;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  header .top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  header h1{
    margin:0;
    font-size:18px;
    font-weight:700;
  }
  header .sub{
    font-size:12px;
    opacity:.9;
    margin-top:2px;
  }
  .switch{
    display:flex;
    background:rgba(255,255,255,.25);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .switch button{
    border:none;
    background:transparent;
    color:#fff;
    padding:7px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    opacity:.75;
  }
  .switch button.active{
    background:#fff;
    color:var(--main-dark);
    opacity:1;
  }
  main{
    max-width:560px;
    margin:0 auto;
    padding:16px;
  }
  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 1px 4px rgba(0,0,0,.05);
    border:1px solid var(--border);
  }
  .card h2{
    font-size:15px;
    margin:0 0 12px;
    color:var(--main-dark);
    display:flex;
    align-items:center;
    gap:6px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin:10px 0 6px;
    color:var(--text);
  }
  select, input[type=text], input[type=date], input[type=time], input[type=number], textarea{
    width:100%;
    max-width:100%;
    min-width:0;
    box-sizing:border-box;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:14px;
    font-family:inherit;
    background:#fffaf5;
    color:var(--text);
  }
  /* iOSのSafariはdate/timeのネイティブ入力欄が幅100%を無視して
     はみ出すことがあるため、追加で明示的に幅を抑える */
  input[type=date], input[type=time]{
    -webkit-appearance:none;
    appearance:none;
    display:block;
  }
  textarea{
    resize:vertical;
    min-height:60px;
  }
  .btn-group{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .btn-group button{
    flex:1;
    min-width:70px;
    padding:10px 6px;
    border:1px solid var(--border);
    background:#fffaf5;
    border-radius:10px;
    font-size:13px;
    cursor:pointer;
    color:var(--text);
    transition:.15s;
  }
  .btn-group button.selected{
    background:var(--main);
    color:#fff;
    border-color:var(--main);
    font-weight:700;
  }
  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .chk-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    font-weight:600;
    color:var(--text);
    cursor:pointer;
  }
  .chk-row input[type=checkbox]{
    width:18px;
    height:18px;
    accent-color:var(--main);
    cursor:pointer;
    flex-shrink:0;
  }
  .field-block{
    padding:12px;
    background:#fdf6ee;
    border-radius:12px;
    margin-bottom:10px;
  }
  .field-block .ttl{
    font-size:13px;
    font-weight:700;
    margin-bottom:8px;
    color:var(--main-dark);
  }
  .unit-input{
    position:relative;
  }
  .unit-input input{
    padding-right:40px;
  }
  .unit-input .unit-suffix{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text-light);
    font-size:14px;
    font-weight:600;
    pointer-events:none;
  }
  .ai-proof-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:8px;
  }
  .ai-proof-btn{
    border:1.5px solid var(--sub);
    background:#fff;

<script>
const FACILITY_NAME = "クロム";
const MEAL_OPTIONS = ["完食","半分","少量"];
const FIXED_NOTE = "引き続き様子を見ながらお預かりいたします。ご様子に変わったことがございましたら、ご連絡いたします。よろしくお願いいたします。";
document.getElementById("fixedNoteText").textContent = FIXED_NOTE;

/* ---- Firebase / Firestore：記録・利用者・担当職員リストを全端末で共有する ---- */
const firebaseConfig = {
  apiKey: "AIzaSyBrz3gIdmGLrMtRCblk7yNGvxCuOvWNtrY",
  authDomain: "rennrakucho.firebaseapp.com",
  projectId: "rennrakucho",
  storageBucket: "rennrakucho.firebasestorage.app",
  messagingSenderId: "861369835671",
  appId: "1:861369835671:web:0662f1143433022e86c9d2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function saveUsers(list){
  db.collection("meta").doc("users").set({ list }).catch(err=>{
    console.error("利用者リストの保存に失敗しました", err);
    showToast("利用者リストの保存に失敗しました。通信環境を確認してください。", 4000);
  });
}

function saveStaffList(list){
  db.collection("meta").doc("staff").set({ list }).catch(err=>{
    console.error("担当職員リストの保存に失敗しました", err);
    showToast("担当職員リストの保存に失敗しました。通信環境を確認してください。", 4000);
  });
}

// Firestoreからの応答が届くまでは空の状態で表示し、届き次第すべての端末で
// 同じ内容に更新される（onSnapshotによるリアルタイム同期）
let USERS = [];
let STAFF_LIST = [];
let entries = [];

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function reiwa(dateStr){
  if(!dateStr) return "";
  const y = parseInt(dateStr.slice(0,4),10);
  return "R" + (y - 2018);
}

/* ---- タブ切替 ---- */
const tabStaff = document.getElementById("tabStaff");
const tabParent = document.getElementById("tabParent");
const staffView = document.getElementById("staffView");
const parentView = document.getElementById("parentView");

tabStaff.addEventListener("click", ()=>{
  tabStaff.classList.add("active");
  tabParent.classList.remove("active");
  staffView.classList.remove("hidden");
  parentView.classList.add("hidden");
});
tabParent.addEventListener("click", ()=>{
  tabParent.classList.add("active");
  tabStaff.classList.remove("active");
  parentView.classList.remove("hidden");
  staffView.classList.add("hidden");
  renderParentView();
});

/* ---- 選択式ボタン（通常は単一選択、data-multi="true"のグループは複数選択可） ---- */
const groupState = {};
document.querySelectorAll(".btn-group").forEach(group=>{
  const name = group.dataset.group;
  const isMulti = group.dataset.multi === "true";
  if(isMulti) groupState[name] = [];
  group.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(isMulti){
        btn.classList.toggle("selected");
        const val = btn.dataset.val;
        const arr = groupState[name] || (groupState[name] = []);
        const idx = arr.indexOf(val);
        if(btn.classList.contains("selected")){
          if(idx === -1) arr.push(val);
        }else{
          if(idx !== -1) arr.splice(idx, 1);
        }
      }else{
        group.querySelectorAll("button").forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
        groupState[name] = btn.dataset.val;
      }
    });
  });
});

document.getElementById("s_date").value = todayStr();

/* ---- 記録一覧からの再編集 ---- */
let editingId = null; // 編集中の記録のid（新規保存時はnull）

function buildEntryFromForm(){
  return {
    id: editingId || crypto.randomUUID(),
    facility: FACILITY_NAME,
    user: document.getElementById("s_user").value,
    staff: document.getElementById("s_staff").value || "未入力",
    date: document.getElementById("s_date").value || todayStr(),
    temp: document.getElementById("s_temp").value || "-",
    menu: document.getElementById("s_menu").value,
    meal: groupState.meal || "未入力",
    mealNote: document.getElementById("s_mealNote").value,
    bathTime: document.getElementById("s_bathTime").value,
    medication: groupState.medication || "未入力",
    medTiming: (groupState.medTiming || []).slice(),
    note: document.getElementById("s_note").value,
    savedAt: new Date().toISOString()
  };
}

// Firestoreに保存する。編集中ならその記録を上書き、そうでなければ新規追加する
// （entries配列自体はonSnapshotの通知で全端末分自動的に更新される）
function commitEntry(entry){
  db.collection("entries").doc(entry.id).set(entry).catch(err=>{
    console.error("記録の保存に失敗しました", err);
    showToast("保存に失敗しました。通信環境を確認してもう一度お試しください。", 4000);
  });
}

// 保存前の必須項目チェック。未入力があればエラーを出して保存を止める
// （「スタッフからひとこと」の個別コメント欄だけは画面上も(任意)表記なので対象外）
function validateForm(){
  if(!document.getElementById("s_user").value){
    showToast("お名前が未入力です。選択してください。", 3000);
    return false;
  }
  if(!document.getElementById("s_date").value){
    showToast("利用日が未入力です。", 3000);
    return false;
  }
  if(!document.getElementById("s_temp").value){
    showToast("体温が未入力です。", 3000);
    return false;
  }
  if(!document.getElementById("s_menu").value.trim()){
    showToast("夕食の献立が未入力です。", 3000);
    return false;

function setGroupSelection(name, values){

  group.querySelectorAll("button").forEach(b=>{

// 施設共有のAPIキーを埋め込み済み。個別に設定する必要はない。
const GEMINI_API_KEY = "AQ.Ab8RN6Joo7e9kdGbN3SVLtmtoF-BcDJXTU7VEikW6luBeVqFdg";

async function proofreadWithGemini(text){
  const key = GEMINI_API_KEY;

  const prompt =
    "あなたは日本語の文章を添削するアシスタントです。以下は介護・福祉施設のスタッフが保護者向けに書いた連絡帳の一文です。" +
    "誤字脱字や不自然な言い回し、助詞の誤りがあれば自然な日本語に直してください。" +
    "内容や意味、敬語の丁寧さのレベルは変えないでください。説明や前置きは一切不要です。添削後の文章だけを出力してください。\n\n" +
    "文章：" + text;

  // "AQ."形式の新しいキーは ?key= のクエリパラメータでは弾かれることがあるため、
  // 現在推奨されている x-goog-api-key ヘッダーで送る
  // モデル名は固定バージョンだと廃止されるたびに直す必要が出るため、
  // 常に最新のFlashモデルを指す "gemini-flash-latest" を使う
  const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent";
  const res = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-goog-api-key": key
    },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }]
    })
  });

  if(!res.ok){
    const errBody = await res.text().catch(()=> "");
    console.error("Gemini API error", res.status, errBody);
    throw new Error("API_ERROR_" + res.status + ": " + errBody.slice(0, 200));
  }

  const data = await res.json();
  const result = data && data.candidates && data.candidates[0] &&
    data.candidates[0].content && data.candidates[0].content.parts &&
    data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;

  if(!result) throw new Error("NO_RESULT");
  return result.trim();
}

const originalTextBeforeProof = {}; // { textareaId: 元のテキスト }

document.querySelectorAll(".ai-proof-btn").forEach(btn=>{
  btn.addEventListener("click", async ()=>{

    const textarea = document.getElementById(targetId);

    const originalLabel = btn.textContent;

      if(undoBtn) undoBtn.classList.remove("hidden");

function formatDate(dstr){
  const d = new Date(dstr+"T00:00:00");
  const days = ["日","月","火","水","木","金","土"];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;
}

function escapeHtml(str){
  return (str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
}

      <span class="pdf-footer-sub">ショートステイ　${escapeHtml(e.facility||"")}　連絡帳</span>
    </div>
  `;
}

// タップした直後・非同期処理が始まる前に空のタブを開いておく関数。
// iOS Safariは、ユーザーの操作から離れたタイミングで発生した画面遷移や
// ダウンロードを「ユーザー操作によるものではない」と判断してブロックする
// ことがあるため、html2canvasの処理などで時間がかかる前に先にタブを
// 確保しておき、あとからそこにPDFを読み込ませる
function openPreviewTab(){
  try{
    return window.open("", "_blank");
  }catch(e){
    return null;
  }
}

// html2pdf.jsの自動改ページ(pagebreakオプション)は、marginとの組み合わせで
// 空白ページが挟まったり、ページ幅いっぱいに画像が広がらず右側に空白が
// できたりと、何度も不具合が出た。そのため2ページ分は自前でキャプチャし、
// jsPDFに1ページずつ「必ずページ幅いっぱい」に貼り付ける方式に変更する。
async function exportPdf(entry, previewTab){
  const overlay = document.getElementById("pdfOverlay");
  const el = document.getElementById("pdfTemplate");

  overlay.classList.add("show");
  overlay.scrollTop = 0;

  // 入力フォームをスクロールした状態で保存ボタンを押すと、
  // html2canvasが座標をそのスクロール量だけズレて計算してしまう不具合が
  // あったため、ページを一番上に戻してからキャプチャする
  window.scrollTo(0, 0);

  // オーバーレイが実際に描画されるのを待ってからキャプチャする
  await new Promise(r => requestAnimationFrame(()=>requestAnimationFrame(r)));

  try{
    const canvasOpt = {
      scale: 2,
      useCORS: true,
      backgroundColor: "#ffffff",
      scrollX: 0,
      scrollY: 0
    };

    el.innerHTML = buildPdfPage1Html(entry);
    const canvas1 = await html2canvas(el, canvasOpt);

    el.innerHTML = buildPdfPage2Html(entry);
    const canvas2 = await html2canvas(el, canvasOpt);

    // A4サイズ（pt）を基準の幅・最低の高さとして使う。文章がたくさん入力されて
    // 1ページ分より内容が長くなった場合は、文字を縮めたり切ったりせず、
    // そのページ自体をその分だけ縦に伸ばして全部入りきるようにする
    const pageW = 595.28;
    const minPageH = 841.89;
    const imgH1 = canvas1.height * pageW / canvas1.width;
    const imgH2 = canvas2.height * pageW / canvas2.width;
    const pageH1 = Math.max(imgH1, minPageH);
    const pageH2 = Math.max(imgH2, minPageH);

    // jspdf.umd.min.jsを読み込むと window.jspdf.jsPDF としてコンストラクタが使える
    const JsPDFCtor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
    const pdf = new JsPDFCtor({ unit: "pt", format: [pageW, pageH1], orientation: "portrait" });
    pdf.addImage(canvas1.toDataURL("image/jpeg", 0.98), "JPEG", 0, 0, pageW, imgH1);

    pdf.addPage([pageW, pageH2]);
    pdf.addImage(canvas2.toDataURL("image/jpeg", 0.98), "JPEG", 0, 0, pageW, imgH2);

    const filename = `連絡帳_${entry.user}_${entry.date}.pdf`;

    if(previewTab && !previewTab.closed){
      // 事前に開いておいたタブにPDFを読み込ませる（iOS Safari向け）。
      // blob: URLは作成した元のタブでしか読み込めず、別タブ(previewTab)に
      // 渡すとabout:blankのままになる不具合があったため、
      // どのタブからでも読み込めるdata: URI（base64埋め込み）を使う
      const dataUri = pdf.output("datauristring");
      previewTab.location.href = dataUri;
    }else{
      // ポップアップが使えなかった場合は従来通りダウンロードを試みる
      pdf.save(filename);
    }
  }catch(err){
    console.error("PDF生成に失敗しました", err);
    showToast("PDFの作成に失敗しました。もう一度お試しください。", 4000);
    if(previewTab && !previewTab.closed) previewTab.close();
  }finally{
    overlay.classList.remove("show");
  }
}

/* ---- Firestoreのリアルタイム同期：他の端末での変更もここで自動的に反映される ---- */

// 記録一覧（entries）
db.collection("entries").onSnapshot(snapshot=>{
  entries = snapshot.docs.map(doc=>doc.data());
  renderParentView();
}, err=>{
  console.error("記録の読み込みに失敗しました", err);
  showToast("記録の読み込みに失敗しました。通信環境を確認してください。", 4000);
});

// 利用者リスト
// （selectは何も指定しないとブラウザが先頭の項目を自動選択してしまうため、
//  アプリを開いた直後の最初の1回だけ、入力画面のお名前を空に戻す。
//  入力中に他の端末が名前を追加した場合などは選択中の内容を消したくないので、
//  2回目以降は何もしない）
let usersFirstLoad = true;
db.collection("meta").doc("users").onSnapshot(doc=>{
  USERS = (doc.exists && Array.isArray(doc.data().list)) ? doc.data().list : [];
  renderUserSelects();
  if(usersFirstLoad){
    document.getElementById("s_user").value = "__cleared__";
    usersFirstLoad = false;
  }
  if(!userManagePanel.classList.contains("hidden")) renderUserManageList();
}, err=>{
  console.error("利用者リストの読み込みに失敗しました", err);
  showToast("利用者リストの読み込みに失敗しました。通信環境を確認してください。", 4000);
});

// 担当職員リスト（考え方は利用者リストと同じ）
let staffFirstLoad = true;
db.collection("meta").doc("staff").onSnapshot(doc=>{
  STAFF_LIST = (doc.exists && Array.isArray(doc.data().list)) ? doc.data().list : [];
  renderStaffSelect();
  if(staffFirstLoad){
    document.getElementById("s_staff").value = "__cleared__";
    staffFirstLoad = false;
  }
  if(!staffManagePanel.classList.contains("hidden")) renderStaffManageList();
}, err=>{
  console.error("担当職員リストの読み込みに失敗しました", err);
  showToast("担当職員リストの読み込みに失敗しました。通信環境を確認してください。", 4000);
});
